<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Who pays whom under positive and negative funding</title>
<desc id="d">When funding is positive, long traders pay short traders. When funding is negative, short traders pay long traders. The payment goes between traders, not to the exchange.</desc>
<rect width="760" height="330" rx="16" fill="#11141b" stroke="#2a2f3a"/>
<defs><marker id="a1fcf8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1fcf8c"/></marker></defs><defs><marker id="aff5d7a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff5d7a"/></marker></defs><text x="190" y="44" font-size="18" fill="#1fcf8c" font-weight="700" text-anchor="middle">Positive funding</text><text x="190" y="66" font-size="13" fill="#a3acba" font-weight="500" text-anchor="middle">perpetual trades above spot</text><rect x="40" y="92" width="130" height="64" rx="10" fill="#1fcf8c" stroke="#1fcf8c" stroke-width="1.5" fill-opacity="0.12"/><text x="105" y="131" font-size="18" fill="#eef1f4" font-weight="700" text-anchor="middle">Longs</text><rect x="210" y="92" width="130" height="64" rx="10" fill="#ff5d7a" stroke="#ff5d7a" stroke-width="1.5" fill-opacity="0.12"/><text x="275" y="131" font-size="18" fill="#eef1f4" font-weight="700" text-anchor="middle">Shorts</text><line x1="172" y1="124" x2="206" y2="124" stroke="#1fcf8c" stroke-width="2.5" marker-end="url(#a1fcf8c)"/><text x="190" y="114" font-size="13" fill="#1fcf8c" font-weight="700" text-anchor="middle">pay</text><text x="190" y="196" font-size="13" fill="#a3acba" font-weight="500" text-anchor="middle">Crowd is leaning long,</text><text x="190" y="214" font-size="13" fill="#a3acba" font-weight="500" text-anchor="middle">so longs pay for the privilege</text><line x1="380" y1="36" x2="380" y2="230" stroke="#2a2f3a"/><text x="570" y="44" font-size="18" fill="#ff5d7a" font-weight="700" text-anchor="middle">Negative funding</text><text x="570" y="66" font-size="13" fill="#a3acba" font-weight="500" text-anchor="middle">perpetual trades below spot</text><rect x="420" y="92" width="130" height="64" rx="10" fill="#ff5d7a" stroke="#ff5d7a" stroke-width="1.5" fill-opacity="0.12"/><text x="485" y="131" font-size="18" fill="#eef1f4" font-weight="700" text-anchor="middle">Shorts</text><rect x="590" y="92" width="130" height="64" rx="10" fill="#1fcf8c" stroke="#1fcf8c" stroke-width="1.5" fill-opacity="0.12"/><text x="655" y="131" font-size="18" fill="#eef1f4" font-weight="700" text-anchor="middle">Longs</text><line x1="552" y1="124" x2="586" y2="124" stroke="#ff5d7a" stroke-width="2.5" marker-end="url(#aff5d7a)"/><text x="570" y="114" font-size="13" fill="#ff5d7a" font-weight="700" text-anchor="middle">pay</text><text x="570" y="196" font-size="13" fill="#a3acba" font-weight="500" text-anchor="middle">Crowd is leaning short,</text><text x="570" y="214" font-size="13" fill="#a3acba" font-weight="500" text-anchor="middle">so shorts pay longs</text><rect x="40" y="252" width="680" height="56" rx="10" fill="none" stroke="#2a2f3a" stroke-width="1" fill-opacity="1"/><text x="380" y="276" font-size="13" fill="#a3acba" font-weight="500" text-anchor="middle">Paid trader-to-trader every funding interval (often every 8 hours), not collected as an exchange fee.</text><text x="380" y="296" font-size="13" fill="#a3acba" font-weight="500" text-anchor="middle">The recurring payment nudges the perpetual price back toward spot.</text>
</svg>
