<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Order clusters at a round number</title>
<desc id="d">A sketch of price rising toward 50,000 dollars and being rejected. Beside it, an order book depth sketch shows the largest cluster of resting orders at exactly 50,000 dollars.</desc>
<rect width="760" height="310" rx="16" fill="#11141b" stroke="#2a2f3a"/>
<text x="40" y="40" font-size="17" fill="#eef1f4" font-weight="700" text-anchor="start">Why price tends to stall at round numbers</text><text x="40" y="62" font-size="12.5" fill="#a3acba" font-weight="500" text-anchor="start">Illustrative sketch, not real market data</text><polyline points="50,260 110,235 160,248 230,200 285,214 350,160 400,176 450,118 500,128 540,104" fill="none" stroke="#4fd8e8" stroke-width="3" stroke-linejoin="round"/><line x1="50" y1="96" x2="560" y2="96" stroke="#f5a623" stroke-width="2" stroke-dasharray="6 6"/><text x="52" y="88" font-size="13" fill="#f5a623" font-weight="700" text-anchor="start">$50,000</text><line x1="540" y1="104" x2="540" y2="80" stroke="#4fd8e8" stroke-width="2.5"/><text x="534" y="76" font-size="12" fill="#4fd8e8" font-weight="600" text-anchor="end">rejection wick</text><text x="50" y="292" font-size="12.5" fill="#a3acba" font-weight="500" text-anchor="start">Price runs into a level where many orders are resting.</text><text x="600" y="96" font-size="12.5" fill="#a3acba" font-weight="600" text-anchor="start">Resting sell orders</text><text x="592" y="125" font-size="12" fill="#a3acba" font-weight="500" text-anchor="end">$50,400</text><rect x="600" y="108" width="40" height="22" rx="4" fill="#3a4150" fill-opacity="1"/><text x="592" y="155" font-size="12" fill="#a3acba" font-weight="500" text-anchor="end">$50,200</text><rect x="600" y="138" width="55" height="22" rx="4" fill="#3a4150" fill-opacity="1"/><text x="592" y="185" font-size="12" fill="#f5a623" font-weight="700" text-anchor="end">$50,000</text><rect x="600" y="168" width="120" height="22" rx="4" fill="#f5a623" fill-opacity="0.9"/><text x="592" y="215" font-size="12" fill="#a3acba" font-weight="500" text-anchor="end">$49,800</text><rect x="600" y="198" width="60" height="22" rx="4" fill="#3a4150" fill-opacity="1"/><text x="592" y="245" font-size="12" fill="#a3acba" font-weight="500" text-anchor="end">$49,600</text><rect x="600" y="228" width="45" height="22" rx="4" fill="#3a4150" fill-opacity="1"/><text x="600" y="272" font-size="12" fill="#a3acba" font-weight="500" text-anchor="start">Depth piles up at the</text><text x="600" y="288" font-size="12" fill="#a3acba" font-weight="500" text-anchor="start">round number</text>
</svg>
