<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">CryptoBolt AI research pipeline</title>
<desc id="d">Live inputs feed a two-pass language model pipeline that produces the written read. Entry, stop and target levels come from separate ATR-based code and are never generated by the model.</desc>
<rect width="760" height="346" rx="16" fill="#11141b" stroke="#2a2f3a"/>
<defs><marker id="aa78bfa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/></marker></defs><defs><marker id="a1fcf8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1fcf8c"/></marker></defs><defs><marker id="aa3acba" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a3acba"/></marker></defs><text x="40" y="36" font-size="17" fill="#eef1f4" font-weight="700" text-anchor="start">Where each number in an AI research read comes from</text><rect x="40" y="60" width="190" height="40" rx="8" fill="#161a22" stroke="#2a2f3a" stroke-width="1.2" fill-opacity="1"/><text x="135" y="85" font-size="12.5" fill="#eef1f4" font-weight="500" text-anchor="middle">Last 72 hours of news</text><rect x="40" y="108" width="190" height="40" rx="8" fill="#161a22" stroke="#2a2f3a" stroke-width="1.2" fill-opacity="1"/><text x="135" y="133" font-size="12.5" fill="#eef1f4" font-weight="500" text-anchor="middle">Fear &amp; Greed reading</text><rect x="40" y="156" width="190" height="40" rx="8" fill="#161a22" stroke="#2a2f3a" stroke-width="1.2" fill-opacity="1"/><text x="135" y="181" font-size="12.5" fill="#eef1f4" font-weight="500" text-anchor="middle">Funding-rate positioning</text><rect x="40" y="204" width="190" height="40" rx="8" fill="#161a22" stroke="#2a2f3a" stroke-width="1.2" fill-opacity="1"/><text x="135" y="229" font-size="12.5" fill="#eef1f4" font-weight="500" text-anchor="middle">Multi-timeframe technicals</text><line x1="232" y1="150" x2="262" y2="150" stroke="#a3acba" stroke-width="2" marker-end="url(#aa3acba)"/><rect x="264" y="100" width="150" height="100" rx="10" fill="#a78bfa" stroke="#a78bfa" stroke-width="1.5" fill-opacity="0.12"/><text x="339" y="138" font-size="14" fill="#a78bfa" font-weight="700" text-anchor="middle">Pass 1</text><text x="339" y="158" font-size="15" fill="#eef1f4" font-weight="700" text-anchor="middle">Research</text><text x="339" y="180" font-size="11.5" fill="#a3acba" font-weight="500" text-anchor="middle">(language model)</text><line x1="416" y1="150" x2="446" y2="150" stroke="#a78bfa" stroke-width="2" marker-end="url(#aa78bfa)"/><rect x="448" y="100" width="150" height="100" rx="10" fill="#a78bfa" stroke="#a78bfa" stroke-width="1.5" fill-opacity="0.12"/><text x="523" y="138" font-size="14" fill="#a78bfa" font-weight="700" text-anchor="middle">Pass 2</text><text x="523" y="158" font-size="15" fill="#eef1f4" font-weight="700" text-anchor="middle">Synthesis</text><text x="523" y="180" font-size="11.5" fill="#a3acba" font-weight="500" text-anchor="middle">(language model)</text><line x1="600" y1="150" x2="628" y2="150" stroke="#a78bfa" stroke-width="2" marker-end="url(#aa78bfa)"/><rect x="630" y="100" width="110" height="100" rx="10" fill="#4fd8e8" stroke="#4fd8e8" stroke-width="1.5" fill-opacity="0.1"/><text x="685" y="138" font-size="14" fill="#eef1f4" font-weight="700" text-anchor="middle">The read</text><text x="685" y="158" font-size="11.5" fill="#a3acba" font-weight="500" text-anchor="middle">Trend, volatility,</text><text x="685" y="174" font-size="11.5" fill="#a3acba" font-weight="500" text-anchor="middle">rationale</text><rect x="264" y="236" width="334" height="52" rx="10" fill="#1fcf8c" stroke="#1fcf8c" stroke-width="1.5" fill-opacity="0.12"/><text x="431" y="259" font-size="13.5" fill="#eef1f4" font-weight="700" text-anchor="middle">ATR-based math (plain code, no model)</text><text x="431" y="277" font-size="12" fill="#a3acba" font-weight="500" text-anchor="middle">Entry, stop and target levels</text><line x1="600" y1="262" x2="685" y2="206" stroke="#1fcf8c" stroke-width="2" marker-end="url(#a1fcf8c)"/><text x="40" y="310" font-size="12.5" fill="#a3acba" font-weight="500" text-anchor="start">The model reasons about context. Ordinary code computes every price level,</text>
<text x="40" y="328" font-size="12.5" fill="#a3acba" font-weight="500" text-anchor="start">so the numbers you would place an order against are never generated by the AI.</text>
</svg>
