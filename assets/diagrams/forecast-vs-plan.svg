<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">A forecast versus an if/then plan</title>
<desc id="d">A forecast states a price target with no way to be proven wrong. An if/then plan names the conditions that keep the idea valid and the condition that ends it.</desc>
<rect width="760" height="290" rx="16" fill="#11141b" stroke="#2a2f3a"/>
<rect x="30" y="30" width="340" height="230" rx="12" fill="#ff5d7a" stroke="#ff5d7a" stroke-width="1.5" fill-opacity="0.07"/><text x="200" y="64" font-size="18" fill="#ff5d7a" font-weight="700" text-anchor="middle">A forecast</text><text x="200" y="106" font-size="16" fill="#eef1f4" font-weight="600" text-anchor="middle">"BTC will reach X"</text><text x="200" y="146" font-size="13.5" fill="#a3acba" font-weight="500" text-anchor="middle">No condition that proves it wrong</text><text x="200" y="172" font-size="13.5" fill="#a3acba" font-weight="500" text-anchor="middle">No exit built in</text><text x="200" y="198" font-size="13.5" fill="#a3acba" font-weight="500" text-anchor="middle">Needs direction, size and timing</text><text x="200" y="224" font-size="13.5" fill="#a3acba" font-weight="500" text-anchor="middle">all correct at once</text><rect x="390" y="30" width="340" height="230" rx="12" fill="#1fcf8c" stroke="#1fcf8c" stroke-width="1.5" fill-opacity="0.07"/><text x="560" y="64" font-size="18" fill="#1fcf8c" font-weight="700" text-anchor="middle">An if/then plan</text><text x="560" y="100" font-size="13.5" fill="#eef1f4" font-weight="600" text-anchor="middle">If price holds level A and funding</text><text x="560" y="118" font-size="13.5" fill="#eef1f4" font-weight="600" text-anchor="middle">stays calm: the trend case is intact</text><text x="560" y="152" font-size="13.5" fill="#eef1f4" font-weight="600" text-anchor="middle">If it loses A while open interest rises:</text><text x="560" y="170" font-size="13.5" fill="#eef1f4" font-weight="600" text-anchor="middle">the idea is wrong, I am out</text><text x="560" y="208" font-size="13.5" fill="#a3acba" font-weight="500" text-anchor="middle">Checkable</text><text x="560" y="232" font-size="13.5" fill="#a3acba" font-weight="500" text-anchor="middle">Exit is part of the plan</text>
</svg>
