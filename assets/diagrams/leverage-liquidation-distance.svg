<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Leverage versus distance to liquidation</title>
<desc id="d">Bar chart. At 1x spot the price would have to fall about 100 percent. At 2x about 50 percent, 5x 20 percent, 10x 10 percent, 20x 5 percent, 50x 2 percent and 100x only about 1 percent.</desc>
<rect width="760" height="410" rx="16" fill="#11141b" stroke="#2a2f3a"/>
<text x="40" y="40" font-size="17" fill="#eef1f4" font-weight="700" text-anchor="start">How far price can move against you before the margin is gone</text><text x="40" y="62" font-size="12.5" fill="#a3acba" font-weight="500" text-anchor="start">Approximate, for a long position, ignoring fees and maintenance margin (real liquidation sits slightly closer).</text><text x="40" y="109" font-size="14" fill="#eef1f4" font-weight="600" text-anchor="start">Spot (1x)</text><rect x="130" y="90" width="500" height="26" rx="6" fill="#1a1e27"/><rect x="130" y="90" width="500" height="26" rx="6" fill="#1fcf8c" fill-opacity=".85"/><text x="645" y="109" font-size="14" fill="#eef1f4" font-weight="700" text-anchor="start">~100%</text><text x="40" y="147" font-size="14" fill="#eef1f4" font-weight="600" text-anchor="start">2x</text><rect x="130" y="128" width="500" height="26" rx="6" fill="#1a1e27"/><rect x="130" y="128" width="250" height="26" rx="6" fill="#1fcf8c" fill-opacity=".85"/><text x="645" y="147" font-size="14" fill="#eef1f4" font-weight="700" text-anchor="start">~50%</text><text x="40" y="185" font-size="14" fill="#eef1f4" font-weight="600" text-anchor="start">5x</text><rect x="130" y="166" width="500" height="26" rx="6" fill="#1a1e27"/><rect x="130" y="166" width="100" height="26" rx="6" fill="#4fd8e8" fill-opacity=".85"/><text x="645" y="185" font-size="14" fill="#eef1f4" font-weight="700" text-anchor="start">~20%</text><text x="40" y="223" font-size="14" fill="#eef1f4" font-weight="600" text-anchor="start">10x</text><rect x="130" y="204" width="500" height="26" rx="6" fill="#1a1e27"/><rect x="130" y="204" width="50" height="26" rx="6" fill="#f5a623" fill-opacity=".85"/><text x="645" y="223" font-size="14" fill="#eef1f4" font-weight="700" text-anchor="start">~10%</text><text x="40" y="261" font-size="14" fill="#eef1f4" font-weight="600" text-anchor="start">20x</text><rect x="130" y="242" width="500" height="26" rx="6" fill="#1a1e27"/><rect x="130" y="242" width="25" height="26" rx="6" fill="#f5a623" fill-opacity=".85"/><text x="645" y="261" font-size="14" fill="#eef1f4" font-weight="700" text-anchor="start">~5%</text><text x="40" y="299" font-size="14" fill="#eef1f4" font-weight="600" text-anchor="start">50x</text><rect x="130" y="280" width="500" height="26" rx="6" fill="#1a1e27"/><rect x="130" y="280" width="10" height="26" rx="6" fill="#ff5d7a" fill-opacity=".85"/><text x="645" y="299" font-size="14" fill="#eef1f4" font-weight="700" text-anchor="start">~2%</text><text x="40" y="337" font-size="14" fill="#eef1f4" font-weight="600" text-anchor="start">100x</text><rect x="130" y="318" width="500" height="26" rx="6" fill="#1a1e27"/><rect x="130" y="318" width="5" height="26" rx="6" fill="#ff5d7a" fill-opacity=".85"/><text x="645" y="337" font-size="14" fill="#eef1f4" font-weight="700" text-anchor="start">~1%</text><text x="40" y="372" font-size="12.5" fill="#a3acba" font-weight="500" text-anchor="start">Rule of thumb: the adverse move that liquidates you is roughly 100% divided by your leverage.</text>
<text x="40" y="392" font-size="12.5" fill="#a3acba" font-weight="500" text-anchor="start">Shorts mirror this: the move that hurts them is up, and about the same size.</text>
</svg>
