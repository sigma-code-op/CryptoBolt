<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Where AI and crypto overlap</title>
<desc id="d">Two overlapping circles. AI contributes interpreting unstructured data and adapting to context. Crypto contributes a tamper-proof ledger and open settlement. The overlap includes trading agents, fraud detection and agents holding wallets.</desc>
<rect width="760" height="350" rx="16" fill="#11141b" stroke="#2a2f3a"/>
<circle cx="290" cy="170" r="130" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa" stroke-width="1.5"/><circle cx="470" cy="170" r="130" fill="#4fd8e8" fill-opacity=".14" stroke="#4fd8e8" stroke-width="1.5"/><text x="250" y="70" font-size="20" fill="#a78bfa" font-weight="700" text-anchor="middle">AI</text><text x="250" y="110" font-size="12.5" fill="#eef1f4" font-weight="500" text-anchor="middle">Reads unstructured data</text><text x="250" y="134" font-size="12.5" fill="#eef1f4" font-weight="500" text-anchor="middle">Adapts to context</text><text x="250" y="158" font-size="12.5" fill="#eef1f4" font-weight="500" text-anchor="middle">Makes judgment calls</text><text x="510" y="70" font-size="20" fill="#4fd8e8" font-weight="700" text-anchor="middle">Crypto</text><text x="505" y="110" font-size="12.5" fill="#eef1f4" font-weight="500" text-anchor="middle">Tamper-proof ledger</text><text x="505" y="134" font-size="12.5" fill="#eef1f4" font-weight="500" text-anchor="middle">Open settlement</text><text x="505" y="158" font-size="12.5" fill="#eef1f4" font-weight="500" text-anchor="middle">Minimal trust needed</text><text x="380" y="128" font-size="13" fill="#f5a623" font-weight="700" text-anchor="middle">Overlap</text><text x="380" y="152" font-size="12.5" fill="#eef1f4" font-weight="600" text-anchor="middle">Trading agents</text><text x="380" y="176" font-size="12.5" fill="#eef1f4" font-weight="600" text-anchor="middle">Fraud detection</text><text x="380" y="200" font-size="12.5" fill="#eef1f4" font-weight="600" text-anchor="middle">Agent wallets</text><text x="380" y="326" font-size="12.5" fill="#a3acba" font-weight="500" text-anchor="middle">Each side covers a weakness of the other: intelligence that can be verified.</text>
</svg>
