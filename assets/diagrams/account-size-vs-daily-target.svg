<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Daily return required for a $1,000 target by account size</title>
<desc id="d">Making 1,000 dollars in one day requires a 200 percent return on a 500 dollar account, 50 percent on 2,000 dollars, 10 percent on 10,000 dollars and 2 percent on 50,000 dollars.</desc>
<rect width="760" height="288" rx="16" fill="#11141b" stroke="#2a2f3a"/>
<text x="40" y="40" font-size="17" fill="#eef1f4" font-weight="700" text-anchor="start">The return needed in a single day to make $1,000</text><text x="40" y="89" font-size="14" fill="#eef1f4" font-weight="600" text-anchor="start">$500 account</text><rect x="190" y="70" width="440" height="26" rx="6" fill="#1a1e27"/><rect x="190" y="70" width="440" height="26" rx="6" fill="#ff5d7a" fill-opacity=".85"/><text x="645" y="89" font-size="14" fill="#eef1f4" font-weight="700" text-anchor="start">200%</text><text x="40" y="129" font-size="14" fill="#eef1f4" font-weight="600" text-anchor="start">$2,000 account</text><rect x="190" y="110" width="440" height="26" rx="6" fill="#1a1e27"/><rect x="190" y="110" width="110" height="26" rx="6" fill="#ff5d7a" fill-opacity=".85"/><text x="645" y="129" font-size="14" fill="#eef1f4" font-weight="700" text-anchor="start">50%</text><text x="40" y="169" font-size="14" fill="#eef1f4" font-weight="600" text-anchor="start">$10,000 account</text><rect x="190" y="150" width="440" height="26" rx="6" fill="#1a1e27"/><rect x="190" y="150" width="22" height="26" rx="6" fill="#f5a623" fill-opacity=".85"/><text x="645" y="169" font-size="14" fill="#eef1f4" font-weight="700" text-anchor="start">10%</text><text x="40" y="209" font-size="14" fill="#eef1f4" font-weight="600" text-anchor="start">$50,000 account</text><rect x="190" y="190" width="440" height="26" rx="6" fill="#1a1e27"/><rect x="190" y="190" width="4" height="26" rx="6" fill="#1fcf8c" fill-opacity=".85"/><text x="645" y="209" font-size="14" fill="#eef1f4" font-weight="700" text-anchor="start">2%</text><text x="40" y="248" font-size="12.5" fill="#a3acba" font-weight="500" text-anchor="start">Same dollar target, wildly different ask.</text>
<text x="40" y="268" font-size="12.5" fill="#a3acba" font-weight="500" text-anchor="start">A fixed daily number ignores account size, the variable that actually matters.</text>
</svg>
