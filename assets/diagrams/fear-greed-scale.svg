<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">The Fear and Greed scale</title>
<desc id="d">A horizontal scale from 0 to 100 split into extreme fear, fear, neutral, greed and extreme greed zones. Boundaries are approximate.</desc>
<rect width="760" height="290" rx="16" fill="#11141b" stroke="#2a2f3a"/>
<text x="40" y="40" font-size="17" fill="#eef1f4" font-weight="700" text-anchor="start">The Fear &amp; Greed index is a mood reading from 0 to 100</text><rect x="40.0" y="76" width="170.0" height="38" fill="#ff5d7a" fill-opacity=".85" rx="8"/><text x="125.0" y="100" font-size="12.5" fill="#0b0e11" font-weight="700" text-anchor="middle">Extreme fear</text><rect x="210.0" y="76" width="136.0" height="38" fill="#ff9a5c" fill-opacity=".85" /><text x="278.0" y="100" font-size="12.5" fill="#0b0e11" font-weight="700" text-anchor="middle">Fear</text><rect x="346.0" y="76" width="68.0" height="38" fill="#b9c0cc" fill-opacity=".85" /><text x="380.0" y="100" font-size="11" fill="#0b0e11" font-weight="700" text-anchor="middle">Neutral</text><rect x="414.0" y="76" width="136.0" height="38" fill="#8fd96b" fill-opacity=".85" /><text x="482.0" y="100" font-size="12.5" fill="#0b0e11" font-weight="700" text-anchor="middle">Greed</text><rect x="550.0" y="76" width="170.0" height="38" fill="#1fcf8c" fill-opacity=".85" rx="8"/><text x="635.0" y="100" font-size="12.5" fill="#0b0e11" font-weight="700" text-anchor="middle">Extreme greed</text><text x="40.0" y="134" font-size="12" fill="#a3acba" font-weight="500" text-anchor="middle">~0</text><text x="210.0" y="134" font-size="12" fill="#a3acba" font-weight="500" text-anchor="middle">~25</text><text x="346.0" y="134" font-size="12" fill="#a3acba" font-weight="500" text-anchor="middle">~45</text><text x="414.0" y="134" font-size="12" fill="#a3acba" font-weight="500" text-anchor="middle">~55</text><text x="550.0" y="134" font-size="12" fill="#a3acba" font-weight="500" text-anchor="middle">~75</text><text x="720.0" y="134" font-size="12" fill="#a3acba" font-weight="500" text-anchor="middle">~100</text><text x="40" y="172" font-size="14" fill="#eef1f4" font-weight="700" text-anchor="start">What feeds it</text><text x="40" y="194" font-size="13" fill="#a3acba" font-weight="500" text-anchor="start">Volatility · momentum and volume · social media activity · Bitcoin dominance · surveys</text><rect x="40" y="214" width="680" height="48" rx="10" fill="#f5a623" stroke="#f5a623" stroke-width="1.2" fill-opacity="0.08"/><text x="380" y="243" font-size="14" fill="#eef1f4" font-weight="600" text-anchor="middle">It describes how the crowd feels now. It does not say where price goes next.</text>
</svg>
